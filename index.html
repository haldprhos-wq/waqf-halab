        /* بطاقة الحديث الشريف */
        .hadith-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .hadith-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: rgba(185, 28, 28, 0.2);
            color: var(--bright-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .hadith-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .hadith-text strong {
            color: var(--text-white);
        }

        /* قسم التبرع المباشر */
        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .badge-safe {
            background-color: var(--text-white);
            color: #065f46;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge-safe .dot {
            width: 7px;
            height: 7px;
            background-color: var(--green-badge);
            border-radius: 50%;
        }

        /* شبكة الشبكة والعملة */
        .crypto-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .crypto-box {
            background-color: #1c0f0f;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
        }

        .crypto-box .sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .crypto-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 16px;
        }

        .coin-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .tron-bg { background-color: #ef4444; }
        .usdt-bg { background-color: #10b981; }

        .crypto-desc {
            font-size: 11px;
            color: #8c7373;
            margin-top: 4px;
            display: block;
        }

        /* صندوق عنوان المحفظة */
        .wallet-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .address-box {
            background-color: #0f0707;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            text-align: left;
            direction: ltr;
        }

        .address-label {
            font-size: 11px;
            color: #8c7373;
            display: block;
            margin-bottom: 6px;
        }

        .wallet-address {
            font-family: monospace;
            font-size: 14px;
            color: var(--text-white);
            word-break: break-all;
            line-height: 1.5;
        }

        .copy-btn {
            width: 100%;
            background-color: var(--bright-red);
            color: var(--text-white);
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            margin-bottom: 14px;
        }

        .copy-btn:hover {
            background-color: #b91c1c;
        }
